# Compose UI tests run on the JVM through Robolectric.
# A plain Application avoids starting Hilt and Firebase in UI tests of stateless composables.
sdk=35
application=android.app.Application
# Portuguese, the language the tests are written in: without it Robolectric uses en-US, which now has texts.
# Large window so tests can force any smaller size with DeviceConfigurationOverride.ForcedSize.
qualifiers=pt-rBR-w1280dp-h1600dp
# Native graphics measure text for real; the legacy mode ignores font size in layout tests.
graphicsMode=NATIVE
