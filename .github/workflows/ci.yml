# Runs the same checks a developer runs locally (see docs/arquitetura.md, "Verificações").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis and formatting (detekt + ktlint rules)
        run: ./gradlew detekt
      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest
      - name: Android lint
        run: ./gradlew lintProdDebug
      - name: Build debug APKs (dev and prod)
        run: ./gradlew assembleDevDebug assembleProdDebug

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Firestore rules and Cloud Functions authorization, against the local emulator.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions/functions
      - name: Install security test dependencies
        run: npm ci
        working-directory: functions/security-tests
      - name: Formatting
        run: npm run format:check
        working-directory: functions/security-tests
      - name: Rules and functions tests (emulator)
        run: npm test
        working-directory: functions/security-tests
